<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAKVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B0E14;
            --surface-color: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00E5FF;
            --text-main: #FFFFFF;
            --text-muted: #8B949E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Шапка с приветствием */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .user-greeting {
            display: flex;
            flex-direction: column;
        }

        .user-greeting span:first-child {
            font-size: 14px;
            color: var(--text-muted);
        }

        .user-greeting span:last-child {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Главная карточка статуса (Glassmorphism) */
        .status-card {
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Анимация свечения на фоне карточки */
        .status-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.1) 0%, transparent 60%);
            z-index: -1;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .shield-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .shield-icon svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-color);
        }

        .status-title {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00E5FF 0%, #0072FF 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        /* Секция тарифов */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
        }

        .tariffs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .tariff-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: border-color 0.2s;
        }

        .tariff-card:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .tariff-months {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .tariff-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .btn-buy {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 0;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tariff-card.popular {
            border-color: var(--accent-color);
            position: relative;
        }

        .popular-badge {
            position: absolute;
            top: -10px;
            background: var(--accent-color);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="user-greeting">
            <span>Добро пожаловать,</span>
            <span id="username">Пользователь</span>
        </div>
    </div>

    <div class="status-card">
        <div class="shield-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
        <div class="status-title">Твоя подписка</div>
        <div class="status-value" id="status-text">Не активна</div>
        
        <button class="btn-primary" onclick="requestVPN()">Получить настройки</button>
    </div>

    <div class="section-title">Продлить доступ</div>
    <div class="tariffs">
        
        <div class="tariff-card">
            <div class="tariff-months">1 месяц</div>
            <div class="tariff-price">150₽</div>
            <button class="btn-buy" onclick="buyPlan('sub_1_month')">Купить</button>
        </div>

        <div class="tariff-card popular">
            <div class="popular-badge">Выгодно</div>
            <div class="tariff-months">3 месяца</div>
            <div class="tariff-price">400₽</div>
            <button class="btn-buy" onclick="buyPlan('sub_3_months')">Купить</button>
        </div>

    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем приложение на весь экран телефона
        tg.expand();
        tg.ready();

        // Устанавливаем цвета приложения под тему Telegram
        tg.setHeaderColor('#0B0E14');
        tg.setBackgroundColor('#0B0E14');

        // Подтягиваем имя пользователя из Телеграма (если есть)
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Функция запроса VPN (отправляет данные боту)
        function requestVPN() {
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация при нажатии
            tg.sendData('get_vpn'); // Бот поймает это сообщение
        }

        // Функция покупки (отправляет данные боту)
        function buyPlan(planId) {
            tg.HapticFeedback.impactOccurred('heavy'); // Сильная вибрация
            tg.sendData(planId); // Отправляем ID тарифа в бота (например, sub_1_month)
        }
    </script>
</body>
</html>
